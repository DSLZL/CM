[package]
name = "cm-runtime"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
cm-abi = { path = "../cm-abi" }
libc = "=0.2.186"
libloading = "=0.8.9"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
semver = "=1.0.27"
sha2 = "=0.10.9"
toml = "=0.9.11"
zip = { version = "=9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
