name: CM Windows ARM64 API surface preflight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed DSLZL/CM main commit
        required: true
        type: string
      request_id:
        description: Unique reviewed mechanism request
        required: true
        type: string
      stage:
        description: Read-only native API surface observation
        required: true
        default: isolation-surface
        type: choice
        options:
          - isolation-surface

permissions:
  contents: read
  actions: read
cache-mode: none

concurrency:
  group: cm-windows-arm64-preflight-${{ inputs.request_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  native-preflight:
    runs-on: windows-11-arm
    timeout-minutes: 15
    cache-mode: none
    env:
      CM_PLATFORM: windows-arm64
      CM_TARGET: aarch64-pc-windows-msvc
      CM_EXECUTION_ROLE: platform_preflight
      CM_SOURCE_REPOSITORY: DSLZL/CM
      CM_BUILDER_REPOSITORY: DSLZL/CM-build-windows-arm64
      CM_SOURCE_SHA: ${{ inputs.source_sha }}
      CM_REQUEST_ID: ${{ inputs.request_id }}
      CM_BUILD_KIND: qualification
      CM_HOST_ORIGIN: ""
      CM_CACHE_MODE: none
      CM_PREFLIGHT_STAGE: ${{ inputs.stage }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout trusted worker revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify runner-injected cache-none authority
        uses: ./.github/actions/cache-authority

      - name: Verify native process and exact public main source before checkout
        id: policy
        env:
          CM_POLICY_TOKEN: ${{ github.token }}
        run: |
          python -B .github/scripts/worker_policy.py native-preflight-self-check
          if ($LASTEXITCODE -ne 0) { throw 'Native authority self-check failed' }
          python -B .github/scripts/worker_policy.py native-preflight
          if ($LASTEXITCODE -ne 0) { throw 'Exact worker/source authority failed' }

      - name: Prepare text evidence paths
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'cm-windows-arm64-preflight-evidence'
          New-Item -ItemType Directory -Path $logs -ErrorAction Stop | Out-Null
          "CM_CI_LOG_DIR=$logs" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "CM_SOURCE_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'cm-source')" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'cm-worker-preflight.json') -Destination (Join-Path $logs 'worker-preflight.json')

      - name: Checkout verified CM source
        id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: DSLZL/CM
          ref: ${{ steps.policy.outputs.source_sha }}
          path: cm-source
          fetch-depth: 1
          persist-credentials: false

      - name: Record native runtime identity
        run: python -B cm-source/ci/scripts/record_run.py "$env:CM_CI_LOG_DIR"

      - name: Observe native isolation API surface
        run: python -B cm-source/ci/scripts/windows_arm64_preflight.py

      - name: Record final native job status
        if: always() && steps.source.outcome == 'success'
        env:
          CM_JOB_STATUS: ${{ job.status }}
        run: python -B cm-source/ci/scripts/record_run.py "$env:CM_CI_LOG_DIR"

      - name: Retain only text surface evidence
        if: always() && steps.policy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-windows-arm64-mechanisms-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CM_CI_LOG_DIR }}
          if-no-files-found: error
          retention-days: 14
