name: CM macOS ARM64 native mechanism preflight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed DSLZL/CM main commit
        required: true
        type: string
      request_id:
        description: Unique reviewed mechanism request
        required: true
        type: string

permissions:
  contents: read
  actions: read
cache-mode: none

concurrency:
  group: cm-macos-arm64-preflight-${{ inputs.request_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native-preflight:
    runs-on: macos-26
    timeout-minutes: 15
    cache-mode: none
    env:
      CM_PLATFORM: macos-arm64
      CM_TARGET: aarch64-apple-darwin
      CM_EXECUTION_ROLE: platform_preflight
      CM_SOURCE_REPOSITORY: DSLZL/CM
      CM_BUILDER_REPOSITORY: DSLZL/CM-build-macos-arm64
      CM_SOURCE_SHA: ${{ inputs.source_sha }}
      CM_REQUEST_ID: ${{ inputs.request_id }}
      CM_BUILD_KIND: qualification
      CM_HOST_ORIGIN: ""
      CM_CACHE_MODE: none
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted worker revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify runner-injected cache-none authority
        uses: ./.github/actions/cache-authority

      - name: Verify native process and exact public main source before checkout
        id: policy
        env:
          CM_POLICY_TOKEN: ${{ github.token }}
        run: |
          python3 -B .github/scripts/worker_policy.py native-preflight-self-check
          python3 -B .github/scripts/worker_policy.py native-preflight

      - name: Prepare text evidence paths
        run: |
          mkdir -p "$RUNNER_TEMP/cm-macos-arm64-preflight-evidence"
          echo "CM_CI_LOG_DIR=$RUNNER_TEMP/cm-macos-arm64-preflight-evidence" >> "$GITHUB_ENV"
          echo "CM_SOURCE_DIR=$GITHUB_WORKSPACE/cm-source" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/cm-worker-preflight.json" "$RUNNER_TEMP/cm-macos-arm64-preflight-evidence/worker-preflight.json"

      - name: Checkout verified CM source
        id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: DSLZL/CM
          ref: ${{ steps.policy.outputs.source_sha }}
          path: cm-source
          fetch-depth: 1
          persist-credentials: false

      - name: Record actual macOS ARM64 run identity
        run: python3 -B cm-source/ci/scripts/record_run.py "$CM_CI_LOG_DIR"

      - name: Run bounded native loading and isolation controls
        run: python3 -B cm-source/ci/scripts/macos_arm64_preflight.py

      - name: Record final native job status
        if: always() && steps.source.outcome == 'success'
        env:
          CM_JOB_STATUS: ${{ job.status }}
        run: python3 -B cm-source/ci/scripts/record_run.py "$CM_CI_LOG_DIR"

      - name: Retain only text mechanism evidence
        if: always() && steps.policy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-macos-arm64-mechanisms-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CM_CI_LOG_DIR }}
          if-no-files-found: error
          retention-days: 14
