name: CM Windows x64 mechanism preflight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed DSLZL/CM main commit
        required: true
        type: string
      request_id:
        description: Unique reviewed mechanism request
        required: true
        type: string
      stage:
        description: Reviewed bounded mechanism gate
        required: true
        default: loader-terminal
        type: choice
        options:
          - loader-terminal
          - isolation-availability
          - lpac-network
          - lpac-registry-read

permissions:
  contents: read
  actions: read
cache-mode: none

concurrency:
  group: cm-windows-x64-preflight-${{ inputs.request_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  native-preflight:
    runs-on: windows-2025
    timeout-minutes: 15
    cache-mode: none
    env:
      CM_PLATFORM: windows-x64
      CM_TARGET: x86_64-pc-windows-msvc
      CM_EXECUTION_ROLE: platform_preflight
      CM_SOURCE_REPOSITORY: DSLZL/CM
      CM_BUILDER_REPOSITORY: DSLZL/CM-build-windows-x64
      CM_SOURCE_SHA: ${{ inputs.source_sha }}
      CM_REQUEST_ID: ${{ inputs.request_id }}
      CM_BUILD_KIND: qualification
      CM_HOST_ORIGIN: ""
      CM_CACHE_MODE: none
      CM_PREFLIGHT_STAGE: ${{ inputs.stage }}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Checkout trusted worker revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify runner-injected cache-none authority
        uses: ./.github/actions/cache-authority

      - name: Verify native process and exact public main source before checkout
        id: policy
        env:
          CM_POLICY_TOKEN: ${{ github.token }}
        run: |
          python -B .github/scripts/worker_policy.py native-preflight-self-check
          if ($LASTEXITCODE -ne 0) { throw 'Native authority self-check failed' }
          python -B .github/scripts/worker_policy.py native-preflight
          if ($LASTEXITCODE -ne 0) { throw 'Exact worker/source authority failed' }

      - name: Prepare text evidence paths
        run: |
          $logs = Join-Path $env:RUNNER_TEMP 'cm-windows-x64-preflight-evidence'
          New-Item -ItemType Directory -Path $logs -ErrorAction Stop | Out-Null
          "CM_CI_LOG_DIR=$logs" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "CM_SOURCE_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'cm-source')" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'cm-worker-preflight.json') -Destination (Join-Path $logs 'worker-preflight.json')

      - name: Checkout verified CM source
        id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: DSLZL/CM
          ref: ${{ steps.policy.outputs.source_sha }}
          path: cm-source
          fetch-depth: 1
          persist-credentials: false

      - name: Select installed native x64 MSVC and Windows SDK
        run: |
          if ($env:CM_PREFLIGHT_STAGE -notin @('loader-terminal', 'isolation-availability', 'lpac-network', 'lpac-registry-read')) { throw 'Unknown mechanism stage' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or @($installation).Count -ne 1) { throw 'Missing unique native MSVC installation' }
          $devcmd = Join-Path $installation 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path -LiteralPath $devcmd -PathType Leaf)) { throw 'Missing installed VsDevCmd' }
          $commandLine = '"' + $devcmd + '" -no_logo -arch=x64 -host_arch=x64 >nul && set'
          $selected = & $env:ComSpec /d /s /c $commandLine
          if ($LASTEXITCODE -ne 0) { throw 'Native x64 developer environment failed' }
          $allowed = @('PATH', 'INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'VCToolsVersion', 'VCINSTALLDIR',
              'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir', 'UCRTVersion', 'VSINSTALLDIR')
          foreach ($line in $selected) {
            if ($line -match '^([^=]+)=(.*)$' -and $Matches[1] -in $allowed) {
              $line | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
            }
          }

      - name: Record actual Windows x64 run identity
        run: python -B cm-source/ci/scripts/record_run.py "$env:CM_CI_LOG_DIR"

      - name: Run bounded fixed-handle loader and ConPTY controls
        if: env.CM_PREFLIGHT_STAGE == 'loader-terminal'
        run: python -B cm-source/ci/scripts/windows_x64_preflight.py

      - name: Probe native PSEC availability before product compilation
        if: env.CM_PREFLIGHT_STAGE == 'isolation-availability'
        run: python -B cm-source/ci/scripts/windows_isolation_preflight.py

      - name: Probe bounded LPAC internal provider and outside network denial
        if: env.CM_PREFLIGHT_STAGE == 'lpac-network'
        run: python -B cm-source/ci/scripts/windows_x64_preflight.py
      - name: Probe LPAC registryRead dependency and host registry denial
        if: env.CM_PREFLIGHT_STAGE == 'lpac-registry-read'
        run: python -B cm-source/ci/scripts/windows_x64_preflight.py

      - name: Record final native job status
        if: always() && steps.source.outcome == 'success'
        env:
          CM_JOB_STATUS: ${{ job.status }}
        run: python -B cm-source/ci/scripts/record_run.py "$env:CM_CI_LOG_DIR"

      - name: Retain only text fixture evidence
        if: always() && steps.policy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-windows-x64-mechanisms-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CM_CI_LOG_DIR }}
          if-no-files-found: error
          retention-days: 14
