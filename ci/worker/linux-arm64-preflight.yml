name: CM Linux ARM64 native mechanism preflight

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed DSLZL/CM main commit
        required: true
        type: string
      request_id:
        description: Unique reviewed mechanism request
        required: true
        type: string
      stage:
        description: Run only the reviewed mechanism stage
        required: true
        type: choice
        default: initial-mechanisms
        options:
          - initial-mechanisms
          - packaged-helper
          - native-inputs-terminal

permissions:
  contents: read
  actions: read
cache-mode: none

concurrency:
  group: cm-arm64-preflight-${{ inputs.request_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  native-preflight:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    cache-mode: none
    env:
      CM_PLATFORM: linux-arm64
      CM_TARGET: aarch64-unknown-linux-gnu
      CM_EXECUTION_ROLE: platform_preflight
      CM_SOURCE_REPOSITORY: DSLZL/CM
      CM_BUILDER_REPOSITORY: DSLZL/CM-build-linux-arm64
      CM_SOURCE_SHA: ${{ inputs.source_sha }}
      CM_REQUEST_ID: ${{ inputs.request_id }}
      CM_PREFLIGHT_STAGE: ${{ inputs.stage }}
      CM_BUILD_KIND: qualification
      CM_HOST_ORIGIN: ""
      CM_CACHE_MODE: none
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout trusted worker revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Verify runner-injected cache-none authority
        uses: ./.github/actions/cache-authority

      - name: Verify native process and exact public main source before checkout
        id: policy
        env:
          CM_POLICY_TOKEN: ${{ github.token }}
        run: |
          python3 -B .github/scripts/worker_policy.py native-preflight-self-check
          python3 -B .github/scripts/worker_policy.py native-preflight

      - name: Prepare text evidence paths
        run: |
          mkdir -p "$RUNNER_TEMP/cm-arm64-preflight-evidence"
          echo "CM_CI_LOG_DIR=$RUNNER_TEMP/cm-arm64-preflight-evidence" >> "$GITHUB_ENV"
          echo "CM_SOURCE_DIR=$GITHUB_WORKSPACE/cm-source" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/cm-worker-preflight.json" "$RUNNER_TEMP/cm-arm64-preflight-evidence/worker-preflight.json"

      - name: Checkout verified CM source
        id: source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: DSLZL/CM
          ref: ${{ steps.policy.outputs.source_sha }}
          path: cm-source
          fetch-depth: 1
          persist-credentials: false

      - name: Record actual ARM64 run identity
        run: python3 -B cm-source/ci/scripts/record_run.py "$CM_CI_LOG_DIR"

      - name: Install the pinned minimal native Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup run 1.95.0 rustc -vV | tee "$CM_CI_LOG_DIR/rustup-pinned.log"

      - name: Install only mechanism probe dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential strace bubblewrap pkg-config libcap-dev
          dpkg-query -W build-essential gcc libc6 strace bubblewrap pkg-config libcap-dev | tee "$CM_CI_LOG_DIR/native-packages.log"

      - name: Enable existing Linux CI namespace requirements on this ephemeral runner
        run: |
          sysctl kernel.unprivileged_userns_clone | tee "$CM_CI_LOG_DIR/userns-setup.log"
          sudo sysctl -w kernel.unprivileged_userns_clone=1 | tee -a "$CM_CI_LOG_DIR/userns-setup.log"
          if [[ -f /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sysctl kernel.apparmor_restrict_unprivileged_userns | tee -a "$CM_CI_LOG_DIR/userns-setup.log"
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 | tee -a "$CM_CI_LOG_DIR/userns-setup.log"
          fi

      - name: Run the selected native mechanism stage
        run: python3 -B cm-source/ci/scripts/linux_arm64_preflight.py "$CM_PREFLIGHT_STAGE"

      - name: Record final native job status
        if: always() && steps.source.outcome == 'success'
        env:
          CM_JOB_STATUS: ${{ job.status }}
        run: python3 -B cm-source/ci/scripts/record_run.py "$CM_CI_LOG_DIR"

      - name: Retain only text mechanism evidence
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-linux-arm64-mechanisms-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CM_CI_LOG_DIR }}
          if-no-files-found: error
          retention-days: 14
