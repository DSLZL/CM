name: CM source CI checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
cache-mode: none

concurrency:
  group: cm-source-check-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  source-ci:
    name: CI infrastructure / Linux x64 / GitHub hosted
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CM_EXECUTION_ROLE: source_checks
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Set runner temporary path
        run: echo "CM_CI_LOG_DIR=$RUNNER_TEMP/cm-source-evidence" >> "$GITHUB_ENV"

      - name: Checkout CM
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require hosted Linux x64 and record run identity
        run: python3 -B ci/scripts/record_run.py "$CM_CI_LOG_DIR"

      - name: Check publication boundary and CI scripts
        run: |
          python3 -B - <<'PY' 2>&1 | tee "$CM_CI_LOG_DIR/source-check.log"
          import json
          import os
          from pathlib import Path
          import py_compile
          import subprocess
          import sys
          import tempfile
          import tomllib

          sys.path.insert(0, "ci/scripts")
          from linux_ci import load_config
          from record_run import require_hosted_linux
          require_hosted_linux()

          tracked_bytes = subprocess.check_output(["git", "ls-files", "-z"])
          tracked = set(tracked_bytes.decode().rstrip("\0").split("\0"))
          ignored = subprocess.run(["git", "check-ignore", "--no-index", "--stdin", "-z"],
                                   input=tracked_bytes, capture_output=True)
          assert ignored.returncode in (0, 1), ignored.stderr.decode()
          assert not ignored.stdout, "Tracked files violate .gitignore: " + repr(ignored.stdout)
          paths = Path("ci/source-files.txt").read_text(encoding="utf-8").splitlines()
          assert paths and len(paths) == len(set(paths)), "Publication paths must be unique"
          missing = [p for p in paths if p not in tracked or not Path(p).is_file() or Path(p).is_symlink()]
          assert not missing, f"Required CI files missing from this commit: {missing}"
          worker = json.loads(Path("ci/worker-files.json").read_text(encoding="utf-8"))
          assert len(worker["files"]) == 20
          assert len({row["destination"] for row in worker["files"]}) == len(worker["files"])
          assert all(row["source"] in paths for row in worker["files"]), "Worker inputs must be published"
          deployments = {row["source"]: row["destination"] for row in worker["files"]}
          assert all(deployments.get(source) == destination for source, destination in {
              ".github/cm-platforms.json": ".github/cm-platforms.json",
              "ci/scripts/cm_platforms.py": ".github/scripts/cm_platforms.py",
              "ci/worker/cache-save/action.yml": ".github/actions/cache-save/action.yml"}.items())
          arm_worker = json.loads(Path("ci/worker-files-linux-arm64.json").read_text(encoding="utf-8"))
          assert arm_worker["repository"] == "DSLZL/CM-build-linux-arm64"
          assert arm_worker["scope"] == "initial-native-mechanism-preflight"
          assert len(arm_worker["files"]) == 7
          assert len({row["destination"] for row in arm_worker["files"]}) == 7
          assert all(row["source"] in paths for row in arm_worker["files"])
          assert {row["destination"] for row in arm_worker["files"]} == {
              ".github/cm-platforms.json", ".github/scripts/cm_platforms.py", ".github/scripts/record_run.py",
              ".github/scripts/worker_policy.py", ".github/actions/cache-authority/action.yml",
              ".github/actions/cache-authority/index.js", ".github/workflows/native-preflight.yml"}
          arm_recipe = Path("ci/worker/linux-arm64-preflight.yml").read_text()
          assert "runs-on: ubuntu-24.04-arm" in arm_recipe and "cache-mode: none" in arm_recipe
          assert not any(value in arm_recipe for value in ("actions/cache/", "cache-save", "secrets.", "attestations: write", "id-token: write"))
          cfg = json.loads(Path(".github/cm-ci.json").read_text())
          if cfg["task_id"] == "CM-G05":
              baseline = json.loads(Path("ci/g05-baseline.json").read_text())
              assert cfg["required_checks"] == [f"CM-G05-AC{i:02}" for i in range(1, 6)]
              assert cfg["acceptance_script"] == "fixtures/compatibility/acceptance.sh"
              assert "ci/g05-baseline.json" not in cfg["native_identity_files"]
              assert (baseline["source_repository"], baseline["worker_repository"], baseline["run_id"], baseline["run_attempt"]) == (
                  "DSLZL/CM", "DSLZL/CM-build-linux-x64", 41431503923, 1)
              assert all(baseline[key]["id"] > 0 and len(baseline[key]["digest"]) == 64
                         for key in ("product_artifact", "input_artifact"))
          if cfg["task_id"] in ("CM-G06", "CM-S01", "CM-S02", "CM-S03"):
              if cfg["task_id"] == "CM-G06":
                  assert cfg["required_checks"] == [f"CM-G06-AC{i:02}" for i in range(1, 8)]
                  assert cfg["acceptance_script"] == "fixtures/sdk-seams/acceptance.sh"
              adapter = json.loads(Path("adapters/codex-e4568a3/source.json").read_text())
              assert adapter["host_api_version"] == "0.11.0" and "sdk-seams.patch" in adapter["patches"]
              assert len(adapter["capabilities"]) == 14
              for owner in ("a", "b"):
                  package = Path("fixtures/mods/sdk-seams-" + owner)
                  author = tomllib.loads((package / "Cargo.toml").read_text())
                  lock = tomllib.loads((package / "Cargo.lock").read_text())
                  assert author["workspace"] == {} and author["lib"]["crate-type"] == ["cdylib"]
                  assert sorted(row["name"] for row in lock["package"]) == ["cm-abi", "cm-sdk", "cm-sdk-seams-" + owner]

          if cfg["task_id"] in ("CM-S01", "CM-S02", "CM-S03"):
              checks = 6 if cfg["task_id"] == "CM-S03" else 5
              assert cfg["required_checks"] == [f'{cfg["task_id"]}-AC{i:02}' for i in range(1, checks + 1)]
              fixture = {"CM-S01": "distribution-provenance", "CM-S02": "compatibility-policy", "CM-S03": "binary-index"}[cfg["task_id"]]
              assert cfg["acceptance_script"] == f"fixtures/{fixture}/acceptance.sh"
              policy = json.loads(Path("crates/cm/src/distribution-policy.json").read_text())
              assert (policy["source_repository_id"], policy["builder_repository_id"]) == (1430833890, 1430833977)
              assert policy["workflow"] == ".github/workflows/build.yml" and policy["ref"] == "refs/heads/main"
              assert policy["verifier"]["version"] == "2.103.3" and len(policy["verifier"]["archive_sha256"]) == 64
              assert len([json.loads(line) for line in Path("crates/cm/src/distribution-root.jsonl").read_text().splitlines()]) == 2
              schema = json.loads(Path("schemas/release-receipt.schema.json").read_text())
              assert schema["additionalProperties"] is False and set(schema["required"]) == set(schema["properties"])
              for path in ("crates/cm/src/provenance.rs", "crates/cm/src/distribution-policy.json", "crates/cm/src/distribution-root.jsonl"):
                  assert path in cfg["native_identity_files"]
          scripts = [Path("ci/scripts") / (name + ".py") for name in
                     ("cm_platforms", "record_run", "worker_policy", "linux_arm64_preflight", "dispatch_build", "acceptance_cache", "retry", "runtime_cases", "sdk_seams", "distribution_provenance", "support_policy", "binary_index", "build_benchmarks", "program_integration", "runtime_consumer")]
          scripts.append(Path("fixtures/distribution-provenance/driver.py"))
          scripts.append(Path("fixtures/compatibility-policy/driver.py"))
          scripts.append(Path("fixtures/binary-index/driver.py"))
          scripts.append(Path("fixtures/build-benchmarks/driver.py"))
          scripts.append(Path("fixtures/program-integration/driver.py"))
          if cfg["task_id"] == "CM-S02":
              support = json.loads(Path("fixtures/compatibility-policy/policy.json").read_text())
              matrix = json.loads(Path("schemas/support-matrix.schema.json").read_text())
              assert support["schema_version"] == 1 and len(support["cases"]) == 8
              assert support["cases"]["versions"]["maintenance_years"] is None
              assert matrix["additionalProperties"] is False and set(matrix["required"]) == set(matrix["properties"])
          for script in scripts:
              py_compile.compile(str(script), cfile=str(Path(os.environ["RUNNER_TEMP"]) / (script.stem + ".pyc")),
                                 doraise=True)
          import cm_platforms
          import record_run
          import worker_policy
          import dispatch_build
          default_platform = cm_platforms.select()
          assert worker["repository"] == default_platform["repository"]
          assert cfg["target"] == cm_platforms.native_inputs()["target"]
          assert "runs-on: " + default_platform["runner"] in Path("ci/worker/linux-recipe.yml").read_text()
          cm_platforms.self_check()
          record_run.self_check()
          worker_policy.cache_budget_self_check()
          worker_policy.native_preflight_self_check()
          import linux_arm64_preflight
          linux_arm64_preflight.self_check()
          assert not cm_platforms.select("linux-arm64")["enabled"]
          dispatch_build.self_check()
          import retry
          retry.validation_self_check()
          for name, count in (("linux-recipe.yml", 17), ("benchmark-role/action.yml", 2)):
              recipe = Path("ci/worker", name).read_text()
              assert recipe.count("uses: ./.cm-worker/.github/actions/cache-save") == count
              assert "uses: actions/cache/save@" not in recipe
          wrapper = Path("ci/worker/cache-save/action.yml").read_text()
          assert "cache-save-plan" in wrapper and "steps.capacity.outputs.save_allowed == 'true'" in wrapper
          assert "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" in wrapper
          for name in ("linux-recipe.yml", "benchmark-author.yml"):
              workflow = Path("ci/worker", name).read_text()
              assert "cm-repository-cache-writer" in workflow and "queue: max" in workflow
          benchmark = Path("ci/worker/benchmark.yml").read_text()
          trust_write = benchmark.split("  trust-write:\n", 1)[1].split("  trust-read:\n", 1)[0]
          trust_read = benchmark.split("  trust-read:\n", 1)[1].split("  runtime:\n", 1)[0]
          assert trust_write.count("uses: ./.cm-worker/.github/actions/cache-save") == 1
          assert "cm-repository-cache-writer" in trust_write and "queue: max" in trust_write
          # Keep the real denied-write probe under runner-enforced read authority.
          assert benchmark.count("uses: actions/cache/save@") == trust_read.count("uses: actions/cache/save@") == 1
          assert "    cache-mode: read\n" in trust_read and "      CM_CACHE_MODE: read\n" in trust_read
          assert "uses: ./.cm-worker/.github/actions/cache-authority" in trust_read
          import program_integration
          program_integration.self_check()
          import build_benchmarks
          build_benchmarks.self_check()
          import tomllib
          template = Path("templates/native-mod")
          cargo = tomllib.loads((template / "Cargo.toml").read_text())
          lock = tomllib.loads((template / "Cargo.lock").read_text())
          assert cargo["workspace"] == {} and cargo["lib"]["crate-type"] == ["cdylib"]
          assert sorted(row["name"] for row in lock["package"]) == ["cm-abi", "cm-native-mod", "cm-sdk"]
          assert (template / ".github/workflows/author.yml").read_bytes() == Path(".github/workflows/cm-mod-author.yml").read_bytes()
          assert "Apache License" in (template / "LICENSE").read_text()
          with tempfile.TemporaryDirectory(dir=os.environ["RUNNER_TEMP"]) as directory:
              fixture = Path(directory)
              (fixture / ".github").mkdir()
              (fixture / ".github/cm-ci.json").write_text(
                  json.dumps({"schema_version": 1, "configured": False}), encoding="utf-8")
              try:
                  load_config(fixture)
              except RuntimeError:
                  pass
              else:
                  raise AssertionError("Unconfigured product builds must fail closed")
          print(f"CI payload: {len(paths)} files; no tracked path violates .gitignore")
          PY

      - name: Verify pinned Codex build inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY' 2>&1 | tee "$CM_CI_LOG_DIR/baseline-check.log"
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import tomllib
          import urllib.request

          cfg = json.loads(Path(".github/cm-ci.json").read_text(encoding="utf-8"))
          pins = cfg["upstream"]
          assert pins["repository"] == "openai/codex"
          assert all(re.fullmatch(r"[0-9a-f]{40}", pins[key]) for key in ("commit", "release_commit"))
          assert re.fullmatch(r"rust-v[0-9]+\.[0-9]+\.[0-9]+", pins["release_tag"])
          assert pins["commit"] != pins["release_commit"], "Research and release identities must stay distinct"

          def api(path):
              request = urllib.request.Request("https://api.github.com/repos/openai/codex/" + path,
                  headers={"Accept": "application/vnd.github+json", "X-GitHub-Api-Version": "2026-03-10",
                           "Authorization": "Bearer " + os.environ["GH_TOKEN"]})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          assert api("commits/" + pins["commit"])["sha"] == pins["commit"]
          tag = api("git/ref/tags/" + pins["release_tag"])["object"]
          assert tag["type"] == "tag", "The pinned release uses an annotated tag"
          release = api("git/tags/" + tag["sha"])["object"]
          assert release["type"] == "commit" and release["sha"] == pins["release_commit"]

          inputs = {}
          for relative in ("codex-rs/Cargo.toml", "codex-rs/Cargo.lock",
                           "codex-rs/rust-toolchain.toml", "codex-rs/app-server/src/extensions.rs"):
              url = "https://raw.githubusercontent.com/openai/codex/" + pins["commit"] + "/" + relative
              with urllib.request.urlopen(url, timeout=30) as response:
                  data = response.read()
              assert data, "Pinned build input is empty: " + relative
              inputs[relative] = {"sha256": hashlib.sha256(data).hexdigest(), "size": len(data)}
              if relative.endswith("rust-toolchain.toml"):
                  assert tomllib.loads(data.decode())["toolchain"]["channel"] == cfg["rust_toolchain"]
              if relative.endswith("/Cargo.toml"):
                  assert tomllib.loads(data.decode())["workspace"]["members"], "Real workspace members required"
              if relative.endswith("/extensions.rs"):
                  assert "thread_extensions" in data.decode(), "Pinned composition source is missing"
          logs = Path(os.environ["CM_CI_LOG_DIR"])
          ci = json.loads((logs / "run-metadata.json").read_text(encoding="utf-8"))["ci"]
          result = {"schema_version": 1, "status": "pass", "upstream": pins, "release_tag_object": tag["sha"],
                    "rust_toolchain": cfg["rust_toolchain"], "inputs": inputs,
                    "source_sha": ci["source_sha"], "run_id": ci["run_id"], "run_attempt": ci["run_attempt"]}
          (logs / "baseline-check.json").write_text(json.dumps(result, indent=2) + "\n", encoding="utf-8")
          print("Verified fixed Codex commit, distinct release, toolchain and four build inputs")
          PY

      - name: Record final job status
        if: always() && steps.checkout.outcome == 'success'
        env:
          CM_JOB_STATUS: ${{ job.status }}
        run: python3 -B ci/scripts/record_run.py "$CM_CI_LOG_DIR"

      - name: Retain source CI logs and run identity
        if: always() && steps.checkout.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-source-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CM_CI_LOG_DIR }}
          if-no-files-found: error
          retention-days: 14
