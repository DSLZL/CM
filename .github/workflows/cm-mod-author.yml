name: CM independent Mod author

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed CM source commit
        required: true
        type: string
      build_kind:
        description: Qualify H or compile only the target Mod against a verified H
        required: true
        default: qualification
        type: choice
        options: [qualification, mod-only]
      host_origin:
        description: Exact qualification origin JSON; required for mod-only
        required: false
        type: string

permissions:
  contents: read
cache-mode: none

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CM_SOURCE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CM_REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
      CM_REQUESTED_BUILD_KIND: ${{ inputs.build_kind }}
      CM_REQUESTED_HOST_ORIGIN: ${{ inputs.host_origin }}
      CM_REQUESTED_CACHE_EPOCH: v1
      CM_DISPATCH_EVIDENCE_DIR: ${{ runner.temp }}/cm-author-dispatch
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require the fixed reviewed CM source
        run: test "$GITHUB_REPOSITORY" = DSLZL/CM
      - name: Dispatch fixed independent worker or report blocked authorization
        env:
          CM_BUILD_FANOUT_TOKEN: ${{ secrets.CM_BUILD_FANOUT_TOKEN }}
        run: python3 -B ci/scripts/dispatch_build.py
      - name: Retain the exact request and worker identities
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cm-author-dispatch-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.CM_DISPATCH_EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 14
