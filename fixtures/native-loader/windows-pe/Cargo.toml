[package]
name = "cm-windows-pe-fixture"
version = "0.1.0"
edition = "2024"
publish = false
build = "../../../crates/cm/build.rs"

[workspace]

[dependencies]
libloading = "=0.8.9"
object = { version = "=0.37.3", default-features = false, features = ["read_core", "pe", "std"] }

[build-dependencies]
cc = "=1.2.55"

[lib]
name = "cm_pe_rust_payload"
crate-type = ["cdylib"]
path = "src/payload.rs"

[[bin]]
name = "cm-pe"
path = "src/main.rs"
